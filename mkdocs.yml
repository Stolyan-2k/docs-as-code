site_name: Docs as Code
site_description: Практическая работа Yan Komarevtsev по настройке Docs as Code.
site_author: Yan Komarevtsev
repo_url: https://github.com/Stolyan-2k/docs-as-code

theme:
  name: readthedocs
  locale: ru
  highlightjs: false

plugins:
  - search:
      lang: [ru, en]

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md

extra_javascript:
  - assets/vendor/mermaid-10.9.3.min.js
  - assets/javascripts/diagrams.js
